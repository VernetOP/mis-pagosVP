<style>

  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .wa{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:7px;
    background:#1f9d55;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px 9px 11px;border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,.18);opacity:.95}

  header{padding:18px 18px 4px;text-align:center}

  .tag{color:var(--ink);font-size:21px;font-weight:600;margin-top:6px}
  main{max-width:640px;margin:0 auto;padding:10px 14px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}

  .tabs.ambitos{margin:0 0 12px}
  .tabs.ambitos button.on{background:#e07a1f}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px}
  button:active{transform:scale(.98)}
  .btn{background:var(--accent);color:#fff;width:100%;margin-top:14px}
  a.btn{display:block;box-sizing:border-box;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;text-align:center;text-decoration:none}
  .btn.sec{background:var(--grey);color:var(--ink)}
  .btn.warn{background:var(--warn)}
  .aviso{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.45}

  .muted{color:var(--muted)} .small{font-size:13px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .l{min-width:0} .row .r{text-align:right;white-space:nowrap}
  .chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
  .c-ok{background:var(--okbg);color:var(--ok)} .c-bad{background:var(--badbg);color:var(--bad)} .c-warn{background:var(--warnbg);color:var(--warn)} .c-grey{background:var(--grey);color:var(--muted)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .pick{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

  .oculto{display:none!important}
  .cargando{opacity:.5;pointer-events:none}
  .vacio{text-align:center;color:var(--muted);padding:30px 10px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 14px 24px}
  .prox{background:#2e6b4f;color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:12px}
  .prox h2{color:#d5e6e1;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;font-weight:600}
  .prox .dia{font-family:Fraunces,serif;font-size:30px;font-weight:700;line-height:1.15}

  .btn-prox{display:block;width:100%;margin-top:14px;background:#fff;color:#2e6b4f}

  .panel{border-radius:18px;padding:10px;margin-bottom:12px}

  .deuda .dl.tot{border-top:1.5px solid #e4a8a2;margin-top:6px;padding-top:9px;font-weight:700;font-size:18px}
  .btn-deuda{display:block;width:100%;margin-top:12px;background:var(--bad);color:#fff}

  .aviso-c h3{margin:4px 0 10px;font-size:18px}
  .aviso-c img{display:block;width:100%;border-radius:12px;margin:4px 0 12px}
  .cl-lista{padding:12px 10px}
  .cl-item{border-radius:10px}
  .crono{--cc:#6b4aa0;--cc-s:#f1ecf8;--cc-t:#5b3c88}
  .cl-item.cl-alt{background:var(--cc-s)}
  .cl-row{display:flex;align-items:center;gap:10px;width:100%;background:transparent;text-align:left;padding:11px 8px;font-weight:500;font-size:15px;border-radius:10px;color:var(--ink)}
  .cl-f{flex:none;width:82px;font-weight:700;color:var(--cc-t);font-size:14px}
  .cl-t{flex:1;min-width:0}
  .cl-x{flex:none;color:var(--muted);transition:transform .2s}
  .cl-row.abierto .cl-x{transform:rotate(180deg)}
  .cl-pas .cl-row{color:var(--muted)} .cl-pas .cl-f{color:var(--muted)}
  .cl-fer .cl-row{color:var(--muted);font-style:italic}
  .cl-sig{outline:2px solid var(--cc)}
  .cl-det{padding:0 10px 12px 100px}
  .cl-mat{font-size:15px;margin-bottom:8px}
  .cl-g{margin:6px 0}
  .lnk{display:inline-block;margin:4px 6px 0 0;padding:7px 12px;border-radius:999px;background:#ece4f6;color:#5b3c88;font-weight:600;font-size:14px;text-decoration:none}
  .cl-dest.cl-prox{border:2px solid var(--cc)}
  .cl-dest h2{color:var(--cc-t)}
  .crono .card h2{color:var(--cc-t)} .crono .card{border-top:4px solid var(--cc)}
  .crono .lnk{background:var(--cc-s);color:var(--cc-t)}
  .mod-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-weight:900;font-size:21px;letter-spacing:.06em;text-align:center;
    border-radius:14px;padding:18px 14px;margin:4px 0 12px;box-shadow:0 2px 6px rgba(0,0,0,.1);color:#1a1a1a}
  .mb-b1{background:#9fd5d1} .mb-b2{background:#b39ddb} .mb-b3{background:#eb636b} .mb-b4{background:#ffbd59}
  .socio-x{font-size:18px;transition:transform .2s} .mod-btn.abierto .socio-x{transform:rotate(180deg)}
  .pensum{width:100%;border-radius:10px;display:block;margin-top:6px}
  .mod-card h2{display:flex;align-items:center;gap:8px} .mod-cod{background:#ffbd59;color:#5a1d22;border-radius:8px;padding:2px 8px;font-size:14px}
  .mod-fechas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
  .mod-fecha{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
  .mod-fecha input{font:inherit;padding:8px;border:1px solid #cfd8d6;border-radius:8px;background:#fff}
  .mod-estado{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:20px;font-weight:700}
  .mod-estado.ok{background:#e3f4e8;color:#1e6b3a} .mod-estado.pend{background:#fff3df;color:#8a5a00}
  .socio-cont .card{border-left:4px solid var(--mc,#9fd5d1)}
  .socio-clase h3{margin:0 0 8px;font-size:16px} .socio-clase.hecha h3{color:var(--muted)}
  .socio-enl .lnk{background:#e3fbf3;color:#0f6b5c}
  .socio-ck{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600}
  .socio-ck input{width:22px;height:22px;accent-color:#1aa58f}
  .lec-prog{margin-top:10px} .lec-bar{height:10px;background:#e3fbf3;border-radius:6px;overflow:hidden;margin-bottom:6px}
  .lec-bar span{display:block;height:100%;background:#1aa58f}
  @media (max-width:420px){.cl-det{padding-left:10px}}
  .cuenta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
  .cuenta:first-of-type{border-top:0}
  .cuenta .num{font-family:ui-monospace,Consolas,monospace;font-size:15px;word-break:break-all}
  .copiar{background:var(--grey);color:var(--ink);padding:8px 12px;font-size:14px;flex:none}
  #instalar{position:sticky;bottom:10px;margin:0 auto;display:block;max-width:612px;width:calc(100% - 28px);box-shadow:0 6px 20px rgba(0,0,0,.15)}
</style>
